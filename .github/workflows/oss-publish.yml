name: oss-publish
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Reviewed candidate workflow run ID for this exact commit
        required: true
        type: string
      candidate_run_attempt:
        description: Reviewed attempt number within the candidate run
        required: true
        type: string
permissions:
  contents: read
env:
  # The reviewed packdb-oss/packdb-sdk commit this repository builds against.
  # Changing it is a CLI decision, made in a CLI pull request.
  SDK_COMMIT: "522c0d951a495e3dddb0a6387256f7ace430fadc"
concurrency:
  group: oss-publication
  cancel-in-progress: false
defaults:
  run:
    working-directory: packdb-cli
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.OSS_PUBLIC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: public-release
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      # This repository resolves packdb-client and packdb-otel from a SIBLING
      # packdb-sdk checkout, because the CLI depends on them by version and they
      # are not published yet. Every gate here resolves dependencies, so every
      # gate needs it. Both repositories are checked out into subdirectories so
      # the sibling layout the manifest expects actually exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: packdb-cli

      # Public SDK checkout uses the job's GITHUB_TOKEN without separate App
      # credentials. Fork compatibility is expected from this change but
      # remains untested.
      #
      # Pinned to a reviewed commit, not a branch. A moving `main` would let a
      # later SDK change alter a CLI candidate with no CLI review, and the
      # CLI's dependency closure would differ from the one that was signed
      # off. Bump this deliberately, in a PR, alongside a regenerated lockfile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: packdb-oss/packdb-sdk
          ref: ${{ env.SDK_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
          path: packdb-sdk

      - name: Confirm the SDK checkout is the reviewed commit
        working-directory: packdb-sdk
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "reviewed: ${SDK_COMMIT}"
          echo "actual:   ${actual}"
          if [ "$actual" != "$SDK_COMMIT" ]; then
            echo "::error title=SDK checkout is not the reviewed commit::refusing to build against an unreviewed SDK"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.10
      - name: Verify approved candidate and publish allowlisted packages
        env:
          OSS_SOURCE_SHA: ${{ github.sha }}
          OSS_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          OSS_CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -x scripts/oss-ci.sh
          scripts/oss-ci.sh publish
