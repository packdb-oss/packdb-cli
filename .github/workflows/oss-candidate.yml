name: oss-candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oss-candidate
  cancel-in-progress: false
env:
  # The reviewed packdb-oss/packdb-sdk commit this repository builds against.
  # Changing it is a CLI decision, made in a CLI pull request.
  SDK_COMMIT: "933487cd269e48726d495ddc7d9115cfefa6884a"
defaults:
  run:
    working-directory: packdb-cli
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: private-candidate
    steps:
      # This repository resolves packdb-client and packdb-otel from a SIBLING
      # packdb-sdk checkout, because the CLI depends on them by version and they
      # are not published yet. Every gate here resolves dependencies, so every
      # gate needs it. Both repositories are checked out into subdirectories so
      # the sibling layout the manifest expects actually exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: packdb-cli

      # Public SDK checkout uses the job's GITHUB_TOKEN without separate App
      # credentials. Fork compatibility is expected from this change but
      # remains untested.
      #
      # Pinned to a reviewed commit, not a branch. A moving `main` would let a
      # later SDK change alter a CLI candidate with no CLI review, and the
      # CLI's dependency closure would differ from the one that was signed
      # off. Bump this deliberately, in a PR, alongside a regenerated lockfile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: packdb-oss/packdb-sdk
          ref: ${{ env.SDK_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
          path: packdb-sdk

      - name: Confirm the SDK checkout is the reviewed commit
        working-directory: packdb-sdk
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "reviewed: ${SDK_COMMIT}"
          echo "actual:   ${actual}"
          if [ "$actual" != "$SDK_COMMIT" ]; then
            echo "::error title=SDK checkout is not the reviewed commit::refusing to build against an unreviewed SDK"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.10
      - name: Qualify exact revision and build candidate
        env:
          OSS_CHECK_SCOPE: full
          OSS_SOURCE_SHA: ${{ github.sha }}
        run: |
          test -x scripts/oss-ci.sh
          scripts/oss-ci.sh candidate
          test -s dist/release-record.json
      - name: Enforce bounded Actions artifact size
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          total = sum(p.stat().st_size for p in Path("dist").rglob("*") if p.is_file())
          if total > 100 * 1024 * 1024:
              raise SystemExit("Candidate exceeds 100 MiB: use reviewed release asset storage")
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: packdb-cli/dist/
          if-no-files-found: error
          retention-days: 3
