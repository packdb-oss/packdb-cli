[package]
name = "packdb-cli-test-harness"
version = "0.2.4"
edition = "2024"
rust-version = "1.94.1"
description = "Test-only executable that runs the packdb-cli command library as a process. Never released."
license = "Apache-2.0"
repository = "https://github.com/packdb-oss/packdb-cli"
publish = false

[[bin]]
name = "packdb-cli-test-harness"
path = "src/main.rs"

[dependencies]
packdb-cli = { version = "0.2.4", path = "../packdb-cli" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.49", features = ["rt"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1.49", features = ["macros", "rt", "rt-multi-thread"] }
wiremock = "0.6"

[features]
default = []
flight-sql = ["packdb-cli/flight-sql"]

[lints.rust]
missing_docs = "deny"
