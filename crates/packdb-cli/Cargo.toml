[package]
name = "packdb-cli"
version = "0.2.4"
edition = "2024"
rust-version = "1.94.1"
description = "The command library behind the PackDB `packdb` command: queries and operator commands against a running server."
license = "Apache-2.0"
readme = "README.md"
keywords = ["packdb", "cli", "sql", "query"]
repository = "https://github.com/packdb-oss/packdb-cli"
# Registry publication remains disabled. Enabling it requires
# a separate reviewed allowlist change and release authorization.
publish = false

[dependencies]
# Enable the `sql` feature so the SQL client (including Arrow result
# formatting) is compiled in. Flight SQL transport is opt-in via the
# flight-sql feature on this crate, which forwards to packdb-client.
packdb-client = { version = "0.2.4", features = ["sql"] }
clap = { version = "4.5", features = ["derive"] }
http = "1"
# SHA-256 for the support bundle's manifest; already the TLS stack's crypto.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
humantime = "2"
# Decodes the server's OTLP export acknowledgements in `smoke-test`.
prost = "0.14"
# Diagnostics read raw status, headers and bounded bodies; the same reqwest the
# SDK uses, with credentials applied through the SDK's `AuthProvider`.
reqwest = "0.13"
# The support bundle's secret scan.
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
# The support bundle's archive container and its temporary file.
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { version = "1.49", features = ["macros", "time"] }
# The `smoke-test` run marker and trace and span identifiers.
uuid = { version = "1", features = ["v4"] }
# Compresses the support bundle.
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
tokio = { version = "1.49", features = ["macros", "rt"] }
wiremock = "0.6"

[features]
default = []
# Enables the Flight SQL transport. Without it `--transport flight-sql` is a
# configuration error and `auto` uses HTTP.
flight-sql = ["packdb-client/flight-sql"]

# These crates are on the SDK/CLI extraction path, so their public API is
# documentation a future consumer reads. Deny rather than warn: CI builds with
# `RUSTFLAGS=-D warnings`, but a local `cargo build` does not, and a warning
# nobody sees is how 749 undocumented items accumulated across this closure.
[lints.rust]
missing_docs = "deny"
